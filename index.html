<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Курс по Бухгалтерскому Учету</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #2c3e50;
      --text-muted: #666666;
      --accent-color: #2563eb;
      --shadow: 0 4px 6px rgba(0,0,0,0.05);
    }

    [data-theme="dark"] {
      --bg-color: #1a1a1a;
      --card-bg: #2d2d2d;
      --text-color: #e0e0e0;
      --text-muted: #aaaaaa;
      --accent-color: #60a5fa;
      --shadow: 0 4px 6px rgba(0,0,0,0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 40px 20px;
      transition: background-color 0.3s, color 0.3s;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    h1 { margin: 0; font-size: 2em; }

    .theme-btn {
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--text-muted);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .card-link {
      text-decoration: none;
      color: inherit;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: var(--shadow);
      height: 100%;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card h3 { margin-top: 0; color: var(--accent-color); }
    .card p { color: var(--text-muted); font-size: 0.95em; line-height: 1.5; }
    .btn-read { font-weight: bold; color: var(--accent-color); margin-top: 15px; display: inline-block; }
  </style>
  
  <script>
    // Мгновенная тема до загрузки страницы
    const savedTheme = localStorage.getItem('theme') || 
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', savedTheme);
  </script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Оглавление курса</h1>
      <button class="theme-btn" onclick="toggleTheme()">🌓 Тема</button>
    </header>

    <!-- Сюда скрипт сам подставит все уроки -->
    <div class="grid" id="lessons-grid"></div>
  </div>

  <!-- Подключаем наш авто-скрипт -->
  <script src="navigation.js"></script>

  <script>
    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
</body>
</html>
